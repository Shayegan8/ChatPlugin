update: true
cooldown: true
chatp:
   playerchat: '&e%player_name% %chatp_group%&r&8: &7{msg}'
   help:
      list:
      - '&cPlayer help'
      - '&r'
      - '&c- &e/chatp reload'
      - '&c- &e/chatp group help'
      - '&c- &e/chatp quit'
      - '&c- &e/chatp join {groupName}'
      - '&c- &e/chatp mute {playerName}'
      - '&c- &e/chatp help'
      - '&c- &e/chatp invite {playerName}'
      - '&c- &e/chatp staff {playerName}'
      - '&c- &e/chatp quit'
      - '&c- &e/chatp request {playerName}'
      - '&c- &e/chatp accept {playerName}'
      - '&c- &e/chatp menu'
      - '&r'
      - '&e&lChatPlugin &r&9https://github.com/Shayegan8/ChatPlugin'
      error: '&cAn error occurred'
   usage: '&c/chatp help to get instruction for all commands'
   permissionMSG: '&cYou dont have a permission!'
   remove:
      usage: '&e/chatp remove &cplayerName'
      notPlayer: '&cYou should be a player'
      notFound: '&cCant find this player :('
      notSame: '&cYour group and the requested player''s group its not the same'
      both: '&cboth players are not in group'
      removed: '%player_name% &asuccessfully removed'
      cant: '&cYou are not admin or staff'
      error: '&cAn error occurred'
   menu:
      notPlayer: '&cYou should be a player'
   reload:
      usage: '&e/chatp reload'
   quit:
      quit: "&eYou are no longer in this group"
      usage: '&e/chatp quit'
      notPlayer: "&cYou should be a player"
      notGroup: '&cYou are not in any group'
      error: '&cAn error occurred'
   accept:
      notPlayer: '&cYou should be a player'
      usage: '&e/chatp accept &cplayerName'
      notFound: '&cCant find this player :('
      notSame: '&cThe player didn''t request to join your group'
      fucked: '&eYou are now in %chatp_group% group'
   mute:
      usage: '&e/chatp mute playername'
      cantPlayer: '&cCant find this player'
      notPlayer: '&cYou should be a player'
      notSame: '&cYou or that player should be in a group'
      muted: '&ePlayer muted'
      cantMute: '&cYou cant mute this player'
      cantFuckYourself: "&cYou cant mute yourself"
      muted: "&ePlayer muted"
      error: '&cAn error occurred'
   join:
      usage: '&e/chatp join groupname'
      notPlayer: '&cYou should be a player'
      invitedFirst: '&eYou should be invited first'
      invited: "&eYou are now in %chatp_group% group"
      error: '&cAn error occurred'
   invite:
      usage: '&e/chatp invite playername'
      cantFuckYourself: '&cYou cant invite yourself'
      cantFind: '&cCant find this player'
      cant: '&cYou need to be admin or staff to invite'
      bar: '&eClick this to join to the group'
      notPlayer: '&cYou should be a player'
      joinMSG: |-
         %player_name% Invited you to %chatp_group%
         &eClick this messaage to join
   group:
      help:
      - '&cPlayer help &8- &e&lGroup &r&7(%chatp_group%)'
      - '&r'
      - '&c- &e/chatp group delete {groupName}'
      - '&c- &e/chatp group help'
      - '&c- &e/chatp group create {groupName}'
      - '&c- &e/chatp group'
      - '&r'
      - '&e&lChatPlugin &r&9https://github.com/Shayegan8/ChatPlugin'
      created: '&e%chatp_group% &ahas been created'
      deleted: '&e%chatp_group% &chas been deleted'
      usage: '&e/chatp group help,create,delete'
      cantCreate: "&cYou are already in a group"
      notExist: "&cThat group dosent exist"
      notIn: "&cYou are not in any group"
      admin: "&eYou are not admin"
   staff:
      usage: '&e/chatp staff {playerName}'
      cantFind: '&cCant find this player'
      cantFuckYourself: '&cYou are admin ;|'
      cantFuckIt: '&cYou should be admin'
      promoted: '&e%player_name% &aSuccessfully promoted'
   request:
      notPlayer: "&cYou should be a player"
      usage: "&e/chatp remove &cplayerName"
      notFound: "&cCant find this player :("
      cantFuckYourself: "&cYou can't send request to yourself"
      dontGroup: "&cThat player dosent have group"
      joinMSG: "%player_name% requested to join to your group\n&eClick this messaage to accept request"
      bar: "&eClick this to join to the group"
      sent: "&aRequest successfully has been sent"
       